name: SW10 S2 B5 Outcome-Free Preparation Certification
on:
  pull_request:
    paths:
      - 'tr_platform/research/swing10_s2_b5_preparation.py'
      - 'tests/test_swing10_s2_b5_preparation.py'
      - 'research_protocols/swing10/SW10_S2_B5_VALIDATION_PROTOCOL_V1*'
      - '.github/workflows/sw10-s2-b5-preparation-cert.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest==8.4.2
      - name: Synthetic preparation only; no credentials or validation panel
        run: python -m pytest -q tests/test_swing10_s2_b5_preparation.py
