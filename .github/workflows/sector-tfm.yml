name: TFM Trading Scan
on:
  push:
    branches: [main, feature/sector-tfm-work]
    paths:
      - 'scripts/tfm/**'
      - 'tests/tfm/**'
      - '.github/workflows/sector-tfm.yml'
  # Existing stock collection starts at 08:15/12:15 UTC and takes up to 40 min.
  # At 09:15/13:15, archive reads have no incremental market-provider calls.
  schedule:
    - cron: '15 9,13 * * 2-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tfm-bearish-v1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/tfm -p 'test_*.py' -v
  scan:
    needs: validate
    # Secret-bearing operational scans run only after reviewed code reaches main.
    # Public standard runner; no cache/artifact uploads or paid provider APIs.
    if: github.ref == 'refs/heads/main' && github.repository == 'dsandoval331/TradingView'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate TFM rules, outcomes and publication contract
        run: python3 -m unittest discover -s tests/tfm -p 'test_*.py' -v
      - name: Append TFM records from existing operational archives
        env:
          SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
        run: python3 scripts/tfm/scan.py
