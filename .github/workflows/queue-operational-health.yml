name: TradingResearch Queue Operational Health Certification

on:
  pull_request:
    paths:
      - 'cloud_compute/queue_health.py'
      - 'cloud_compute/queue_health_history.py'
      - 'cloud_compute/queue_health_runner.py'
      - 'tests/test_queue_health.py'
      - 'tests/test_queue_health_history.py'
      - 'tests/test_queue_health_runner.py'
      - 'supabase/migrations/20260925_add_queue_operational_health_history.sql'
      - '.github/workflows/queue-operational-health.yml'
      - '.github/workflows/queue-operational-health-scheduled.yml'

permissions:
  contents: read

concurrency:
  group: trading-research-queue-operational-health-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Queue health contracts
        run: python -m pytest -q tests/test_queue_health.py tests/test_queue_health_history.py tests/test_queue_health_runner.py tests/test_queue_resilience.py
