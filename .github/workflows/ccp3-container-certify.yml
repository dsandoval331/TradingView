name: CCP-3 Container Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile.research'
      - '.dockerignore'
      - 'cloud_compute/**'
      - 'research_runner/**'
      - 'requirements.txt'
      - 'tests/test_ccp3_container_contract.py'
      - 'tests/test_cloud_compute_container_contract.py'
      - '.github/workflows/ccp3-container-certify.yml'

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run CCP-3 tests
        run: pytest -q tests/test_ccp3_container_contract.py tests/test_cloud_compute_container_contract.py tests/test_research_runner_work_root.py

      - name: Build research image
        run: docker build --build-arg TR_GIT_SHA="$GITHUB_SHA" -f Dockerfile.research -t trading-research-runner:ccp3 .

      - name: Run research image smoke test
        run: |
          docker run --rm trading-research-runner:ccp3 | tee /tmp/ccp3-status.txt
          grep -F 'CODE_ROOT=/app' /tmp/ccp3-status.txt
          grep -F 'WORK_ROOT=/workspace' /tmp/ccp3-status.txt
          grep -F "GIT_SHA=$GITHUB_SHA" /tmp/ccp3-status.txt

      - name: Run native parity fixture
        run: |
          rm -rf /tmp/ccp3-native /tmp/ccp3-container
          mkdir -p /tmp/ccp3-native /tmp/ccp3-container
          TR_WORK_ROOT=/tmp/ccp3-native TR_GIT_SHA="$GITHUB_SHA" python -m research_runner.runner run-next --project ccp
          test -f /tmp/ccp3-native/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json

      - name: Run container parity fixture
        run: |
          docker run --rm \
            -v /tmp/ccp3-container:/workspace \
            trading-research-runner:ccp3 run-next --project ccp
          test -f /tmp/ccp3-container/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json

      - name: Certify native-container artifact parity
        run: |
          cmp \
            /tmp/ccp3-native/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json \
            /tmp/ccp3-container/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json
          native_sha=$(sha256sum /tmp/ccp3-native/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json | awk '{print $1}')
          container_sha=$(sha256sum /tmp/ccp3-container/research_outputs/cloud_compute/ccp3/runner_parity_fixture.json | awk '{print $1}')
          test "$native_sha" = "$container_sha"
          echo "CCP3_PARITY=PASS"
          echo "CCP3_PARITY_SHA256=$native_sha"
