name: Research Revision Adapter Certification

on:
  pull_request:
    paths:
      - 'cloud_compute/research_revision_adapter.py'
      - 'tests/test_research_revision_adapter.py'
      - '.github/workflows/research-revision-adapter-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Adapter regression tests
        run: pytest -q tests/test_research_revision_adapter.py
      - name: Current CCP contracts
        run: |
          pytest -q \
            tests/test_ccp5_control_plane.py \
            tests/test_ccp5_control_plane_worker.py \
            tests/test_ccp6_control_plane_artifacts.py \
            tests/test_ccp7_executor_routing.py \
            tests/test_ccp8_autonomous_loop.py \
            tests/test_ccp9_cloud_run.py
