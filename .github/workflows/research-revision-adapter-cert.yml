name: Research Revision Adapter Certification

on:
  pull_request:
    paths:
      - 'cloud_compute/**'
      - 'tests/**'
      - '.github/workflows/research-revision-adapter-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Certify CCP contracts and research-revision adapter
        run: |
          pytest -q \
            tests/test_ccp5_control_plane.py \
            tests/test_ccp5_control_plane_worker.py \
            tests/test_ccp6_autonomous_loop.py \
            tests/test_ccp7_free_compute_tracker.py \
            tests/test_ccp8_dispatcher.py \
            tests/test_ccp9_github_actions_execution.py \
            tests/test_queue_watcher.py \
            tests/test_research_revision.py \
            tests/test_research_revision_runner.py \
            tests/test_governed_execution.py
