name: CCP-11 Reliability Audit Certification

on:
  push:
    branches:
      - cloud-compute/ccp11-reliability-certification
    paths:
      - 'cloud_compute/reliability_audit.py'
      - 'tests/test_ccp11_reliability_audit.py'
      - '.github/workflows/ccp11-reliability-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: pip install pytest
      - name: Run CCP-11 reliability audit tests
        run: pytest -q tests/test_ccp11_reliability_audit.py
