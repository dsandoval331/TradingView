name: Generate web lockfile

on:
  push:
    branches:
      - fix/trading-research-web-lockfile
    paths:
      - .github/workflows/generate-web-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/trading-research-web-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/trading-research-web/package.json

      - name: Generate package-lock.json
        working-directory: apps/trading-research-web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/trading-research-web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add Trading Research web app lockfile"
          git push origin HEAD:fix/trading-research-web-lockfile
