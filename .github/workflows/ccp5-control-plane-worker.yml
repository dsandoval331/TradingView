name: CCP-5 Control Plane Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud_compute/control_plane_worker.py'
      - 'tests/test_ccp5_control_plane_worker.py'
      - '.github/workflows/ccp5-control-plane-worker.yml'

jobs:
  certify-worker-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Test worker lifecycle contract
        run: pytest -q tests/test_ccp5_control_plane_worker.py tests/test_ccp5_control_plane.py

  execute-control-plane-job:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Execute one queued control-plane job
        run: python -m cloud_compute.control_plane_worker --executor github_actions --external-execution-id "$GITHUB_RUN_ID"
