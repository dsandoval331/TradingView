name: TradingResearch Governed Queue Watcher

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-research-governed-queue-watcher
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - id: select
        run: python -m cloud_compute.queue_watcher --limit 10

  dispatch:
    needs: select
    if: ${{ needs.select.outputs.jobs != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJson(needs.select.outputs.jobs) }}
    uses: ./.github/workflows/trading-research-dispatch.yml
    with:
      job_id: ${{ matrix.job.job_id }}
      git_sha: ${{ matrix.job.git_sha }}
      target_ref: ${{ matrix.job.target_ref }}
    secrets: inherit
