name: SW10 S2 B4 Outcome-Free Contract Preparation
on:
  pull_request:
    paths:
      - 'tr_platform/research/swing10_s2_b4_contract.py'
      - 'tests/test_swing10_s2_b4_contract.py'
      - 'research_protocols/swing10/SW10_S2_B4_PROTOCOL_V1.persisted.json'
      - '.github/workflows/sw10-s2-b4-contract-cert.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install pytest==8.4.2
      - name: Synthetic contract and existing causal-preflight regression
        run: python -m pytest -q tests/test_swing10_s2_b4_contract.py tests/test_swing10_s2_b4_preflight.py
