name: SW10 B5A Outcome-Blind Entitlement Boundary Verification
on:
  pull_request:
    paths:
      - 'cloud_compute/swing10_b5a_boundary_verify.py'
      - 'tests/test_swing10_b5a_boundary_verify.py'
      - '.github/workflows/sw10-s2-b5a-boundary-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cloud_compute/swing10_b5a_boundary_verify.py'
      - 'tests/test_swing10_b5a_boundary_verify.py'
      - '.github/workflows/sw10-s2-b5a-boundary-verify.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_swing10_b5a_boundary_verify.py tests/test_swing10_s2_b5_acquisition.py tests/test_ccp11_artifact_contract.py
      - name: Governed metadata-only availability probes and durable byte readbacks
        if: ${{ github.event_name == 'push' }}
        env:
          SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m cloud_compute.swing10_b5a_boundary_verify
