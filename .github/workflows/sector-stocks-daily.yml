name: Stock Tracker Daily History
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stock_tracker/collect.py'
      - 'apps/trading-research-web/app/dashboard/sector-rotation/stocks/top50.json'
      - '.github/workflows/sector-stocks-daily.yml'
  schedule:
    - cron: '15 8,12 * * 2-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sector-rotation-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate collectors
        run: python3 -m unittest discover -s tests/sector_rotation -p 'test_*.py'
      - name: Collect requested stocks under MWE-SECTOR-STOCKS-001
        env:
          SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TR_MASSIVE_API_KEY: ${{ secrets.TR_MASSIVE_API_KEY }}
        run: python3 scripts/stock_tracker/collect.py
