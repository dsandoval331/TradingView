name: TradingResearch Queue Resilience Reconciler

on:
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-research-queue-resilience-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reconcile stale wakeups and inspect running ownership
        run: python -m cloud_compute.queue_resilience_runner
