name: CCP-11 Live Stale Recovery Certification

on:
  push:
    branches:
      - cloud-compute/ccp11-reliability-certification
    paths:
      - 'cloud_compute/executor_liveness.py'
      - 'cloud_compute/ccp11_stale_recovery_live_cert.py'
      - '.github/workflows/ccp11-live-stale-recovery-cert.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify-stale-recovery:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Certify completed-run liveness and safe stale requeue
        run: python -m cloud_compute.ccp11_stale_recovery_live_cert
