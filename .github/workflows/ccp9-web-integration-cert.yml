name: CCP-9 Web Integration Certification

on:
  push:
    branches:
      - cloud-compute/ccp9-vercel-integration
    paths:
      - 'cloud_compute/**'
      - 'apps/trading-research-web/**'
      - 'tests/test_ccp5_control_plane.py'
      - 'tests/test_ccp5_control_plane_worker.py'
      - 'tests/test_ccp8_autonomous_loop.py'
      - 'tests/test_ccp9_exact_claim.py'
      - '.github/workflows/ccp9-web-job.yml'
      - '.github/workflows/ccp9-web-integration-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run cloud control-plane tests
        run: pytest -q tests/test_ccp5_control_plane.py tests/test_ccp5_control_plane_worker.py tests/test_ccp8_autonomous_loop.py tests/test_ccp9_exact_claim.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: apps/trading-research-web
        run: npm install --no-audit --no-fund
      - name: Typecheck web app
        working-directory: apps/trading-research-web
        run: npx tsc --noEmit
      - name: Build web app
        working-directory: apps/trading-research-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          SUPABASE_SECRET_KEY: sb_secret_example
          TR_GITHUB_ACTIONS_TOKEN: test-actions-token
          TR_GITHUB_REPOSITORY: dsandoval331/TradingView
          TR_GIT_SHA: ${{ github.sha }}
          TR_GIT_REF: cloud-compute/ccp9-vercel-integration
        run: npm run build
