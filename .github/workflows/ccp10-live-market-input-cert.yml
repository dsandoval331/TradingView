name: CCP-10 Live Market Input Certification

on:
  push:
    branches:
      - cloud-compute/ccp10-research-lane-migration
    paths:
      - '.github/workflows/ccp10-live-market-input-cert.yml'
  workflow_dispatch:

jobs:
  certify-live-input:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
      TR_WORK_ROOT: ${{ github.workspace }}/.ccp10-work
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create governed job and declared market-data input
        id: submit
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cloud_compute.control_plane import ControlPlaneConfig, create_job, create_job_input

          cfg = ControlPlaneConfig(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SECRET_KEY'])
          job = create_job(cfg, {
              'strategy_id': '98f761bf-c6f1-4399-b10e-e299cb332141',
              'runner_job_id': 'CCP10-MARKET-DATA-INPUT',
              'project_code': 'CLOUD_COMPUTE',
              'phase_code': 'CCP-10',
              'status': 'queued',
              'preferred_executor': 'github_actions',
              'cloud_run_spend_approved': False,
              'priority': 10,
              'git_sha': os.environ['GITHUB_SHA'],
              'dataset_version': 'CCP10-LIVE-MARKET-INPUT-SPY-2025',
              'parameters_json': {'submission_source': 'ccp10_live_cert', 'purpose': 'market data input materialization certification'},
          })
          create_job_input(cfg, {
              'job_id': job['job_id'],
              'input_type': 'market_data',
              'dataset_version': 'MARKET_CACHE_V1',
              'object_path': '1m/SPY/2025.parquet',
              'object_size_bytes': 9736581,
              'sha256': 'aebd8dbaae28bee2c247b00f3469c2c4204a4585a19967454403e4552145bd0a',
              'required': True,
              'metadata_json': {'bucket_name': 'trading-research-market-data'},
          })
          print(f"JOB_ID={job['job_id']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"job_id={job['job_id']}\n")
          PY
      - name: Execute exact governed job with materialized input
        run: >-
          python -m cloud_compute.autonomous_loop
          --executor github_actions
          --external-execution-id "$GITHUB_RUN_ID"
          --job-id "${{ steps.submit.outputs.job_id }}"
          --max-jobs 1
