name: CCP-10 Input Materialization Certification

on:
  push:
    branches:
      - cloud-compute/ccp10-research-lane-migration
    paths:
      - 'cloud_compute/**'
      - 'tests/test_ccp5_control_plane.py'
      - 'tests/test_ccp5_control_plane_worker.py'
      - 'tests/test_ccp8_autonomous_loop.py'
      - 'tests/test_ccp9_exact_claim.py'
      - 'tests/test_ccp10_input_materializer.py'
      - '.github/workflows/ccp10-input-materialization-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run CCP-10 control-plane and input tests
        run: >-
          pytest -q
          tests/test_ccp5_control_plane.py
          tests/test_ccp5_control_plane_worker.py
          tests/test_ccp8_autonomous_loop.py
          tests/test_ccp9_exact_claim.py
          tests/test_ccp10_input_materializer.py
