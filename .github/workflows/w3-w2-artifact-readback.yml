name: W3 Isolated W2 Artifact Readback
on:
  push:
    branches:
      - infra/w3-artifact-readback-20260929
    paths:
      - .github/workflows/w3-w2-artifact-readback.yml
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Read exact W2 primary artifact and verify bytes
        run: python -m cloud_compute.artifact_readback --job-id 8336c2bb-6bc5-497e-951e-1196e0efe105 --name fixture.json
