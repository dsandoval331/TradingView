name: SW10 S3 Frozen Preflight Certification
on:
  pull_request:
    paths:
      - 'tr_platform/research/swing10_s3_*.py'
      - 'tests/test_swing10_s3_*.py'
      - 'tests/test_research_revision_adapter.py'
      - 'research_protocols/swing10/SW10_S3_CANDIDATE_PROTOCOL_V1.*.json'
      - 'cloud_compute/**'
      - 'research_runner/runner.py'
      - '.github/workflows/sw10-s3-preparation-cert.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependencies
        run: pip install -r requirements.txt pytest
      - name: Certify frozen engine, protected guards, exact adapter and control-plane integration on synthetic data only
        run: >-
          python -m pytest -q
          tests/test_swing10_s3_preparation.py tests/test_swing10_s3_frozen.py tests/test_swing10_s3_integration.py tests/test_swing10_s3_streaming.py
          tests/test_ccp5_control_plane.py tests/test_ccp5_control_plane_worker.py tests/test_ccp8_autonomous_loop.py
          tests/test_ccp9_exact_claim.py tests/test_ccp10_input_materializer.py tests/test_ccp11_artifact_contract.py
          tests/test_research_revision_adapter.py tests/test_swing10_input_prepare.py
