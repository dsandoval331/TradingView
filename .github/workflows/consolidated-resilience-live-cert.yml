name: TradingResearch Consolidated Resilience Live Certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidated-resilience-live-cert.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-research-consolidated-resilience-live-cert
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Atomic claim live certification
        run: python -m cloud_compute.ccp11_concurrency_cert --workers 8
      - name: Stale recovery live certification
        run: python -m cloud_compute.ccp11_stale_recovery_live_cert
      - name: Post-certification operational health
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m cloud_compute.queue_health_runner
