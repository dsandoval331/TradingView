name: CCP-5 Control Plane Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud_compute/control_plane.py'
      - 'tests/test_ccp5_control_plane.py'
      - 'docs/cloud-compute/CCP-5-CONTROL-PLANE.md'
      - '.github/workflows/ccp5-control-plane-certify.yml'

jobs:
  certify-control-plane-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run CCP-5 control-plane tests
        run: pytest -q tests/test_ccp5_control_plane.py
