name: CCP-11 Live Multi-Artifact Certification

on:
  push:
    branches:
      - cloud-compute/ccp11-reliability-certification
    paths:
      - '.github/workflows/ccp11-live-multi-artifact-cert.yml'
  workflow_dispatch:

jobs:
  certify-live-multi-artifact:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ github.sha }}
      TR_WORK_ROOT: ${{ github.workspace }}/.ccp11-work
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create governed CCP-11 multi-artifact proof job
        id: submit
        shell: bash
        run: |
          python - <<'PY'
          import os
          from cloud_compute.control_plane import ControlPlaneConfig, create_job, create_job_input

          cfg = ControlPlaneConfig(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SECRET_KEY'])
          job = create_job(cfg, {
              'strategy_id': '98f761bf-c6f1-4399-b10e-e299cb332141',
              'runner_job_id': 'CCP10-PMPD-EDGE-E1-B2-POC',
              'project_code': 'CLOUD_COMPUTE',
              'phase_code': 'CCP-11',
              'status': 'queued',
              'preferred_executor': 'github_actions',
              'cloud_run_spend_approved': False,
              'priority': 10,
              'git_sha': os.environ['GITHUB_SHA'],
              'dataset_version': 'CCP11-MULTI-ARTIFACT-PMPD-B2-1',
              'parameters_json': {
                  'submission_source': 'ccp11_live_multi_artifact_cert',
                  'purpose': 'CCP-11 live artifact completeness certification using unchanged CCP-10 PMPD proof workload',
                  'proof_of_concept_only': True,
                  'pmpd_research_interpretation_authorized': False,
                  'pmpd_model_change_authorized': False,
              },
          })
          create_job_input(cfg, {
              'job_id': job['job_id'],
              'input_type': 'upstream_artifact',
              'dataset_version': 'PMPD-POST9N-B1-CANONICAL',
              'object_path': 'upstream/pmpd/post9n_batch1/context_enriched.parquet',
              'object_size_bytes': 3865352,
              'sha256': 'de184977c9b66035975f2faac4cfadfd95173875504c78c79ce454b30191affe',
              'required': True,
              'metadata_json': {
                  'bucket_name': 'trading-research-market-data',
                  'source_artifact_id': '81254126-7f71-4940-8a00-c67633415908',
                  'local_relative_path': 'research_outputs/pmpd/post9n_batch1/context_enriched.parquet',
                  'dependency_manifest_v1': True,
              },
          })
          print(f"JOB_ID={job['job_id']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"job_id={job['job_id']}\n")
          PY
      - name: Execute exact governed multi-artifact proof job
        run: >-
          python -m cloud_compute.autonomous_loop
          --executor github_actions
          --external-execution-id "$GITHUB_RUN_ID"
          --job-id "${{ steps.submit.outputs.job_id }}"
          --max-jobs 1
