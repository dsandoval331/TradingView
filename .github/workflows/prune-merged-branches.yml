name: Prune merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches proven merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          kept_open_pr=0
          kept_no_merged_pr=0
          kept_unique=0

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"

            if [[ "$branch" == "$DEFAULT_BRANCH" || "$branch" == "HEAD" ]]; then
              continue
            fi

            # Gate 1: never delete a branch that still has an open PR.
            open_pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --base "$DEFAULT_BRANCH" --json number --jq 'length')"
            if [[ "$open_pr_count" != "0" ]]; then
              echo "KEEP (open PR): $branch"
              kept_open_pr=$((kept_open_pr + 1))
              continue
            fi

            # Gate 2: require explicit evidence that this branch was merged by PR
            # into main. This prevents a newly-created branch (whose tip initially
            # equals main) from being mistaken for a completed branch.
            merged_pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --head "$branch" --base "$DEFAULT_BRANCH" --limit 100 --json number,mergedAt --jq '[.[] | select(.mergedAt != null)] | length')"
            if [[ "$merged_pr_count" == "0" ]]; then
              echo "KEEP (no merged PR into main): $branch"
              kept_no_merged_pr=$((kept_no_merged_pr + 1))
              continue
            fi

            # Gate 3: current branch tip must already be reachable from main.
            # If anyone added commits after the merge, retain the branch.
            if git merge-base --is-ancestor "origin/$branch" "origin/$DEFAULT_BRANCH"; then
              echo "DELETE (merged PR + fully contained): $branch"
              encoded_ref="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote("heads/" + sys.argv[1], safe=""))' "$branch")"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$encoded_ref"
              deleted=$((deleted + 1))
            else
              echo "KEEP (unique commits remain): $branch"
              kept_unique=$((kept_unique + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Deleted: $deleted"
          echo "Kept because an open PR exists: $kept_open_pr"
          echo "Kept because no merged PR into main exists: $kept_no_merged_pr"
          echo "Kept because unique commits remain: $kept_unique"
