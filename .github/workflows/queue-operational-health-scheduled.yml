name: TradingResearch Queue Operational Health Scheduled

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-research-queue-operational-health-scheduled
  cancel-in-progress: false

jobs:
  operational-health:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Queue health contracts
        run: python -m pytest -q tests/test_queue_health.py tests/test_queue_health_history.py tests/test_queue_health_runner.py tests/test_queue_resilience.py
      - name: Operational health snapshot and v2 persistence
        run: python -m cloud_compute.queue_health_runner
