name: TradingResearch Governed Dispatcher

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase research_jobs.job_id to execute
        required: true
        type: string
      git_sha:
        description: Exact Git SHA recorded on the governed job
        required: true
        type: string
      target_ref:
        description: Governed source ref associated with the submitted revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-governed-job:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_GIT_SHA: ${{ inputs.git_sha }}
      TR_GIT_REF: ${{ inputs.target_ref }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.job_id }}" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "${{ inputs.git_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "${{ inputs.target_ref }}"

      - name: Checkout exact governed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 1

      - name: Verify exact checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.git_sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Certify cloud control-plane contracts
        run: pytest -q tests/test_ccp5_control_plane.py tests/test_ccp5_control_plane_worker.py tests/test_ccp8_autonomous_loop.py tests/test_ccp9_exact_claim.py

      - name: Execute exact governed job
        run: python -m cloud_compute.autonomous_loop --executor github_actions --external-execution-id "$GITHUB_RUN_ID" --job-id "${{ inputs.job_id }}" --max-jobs 10
