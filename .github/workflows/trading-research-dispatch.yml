name: TradingResearch Governed Dispatcher

on:
  workflow_call:
    inputs:
      job_id:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase research_jobs.job_id to execute
        required: true
        type: string
      git_sha:
        description: Exact Git SHA recorded on the governed research job
        required: true
        type: string
      target_ref:
        description: Governed source ref associated with the submitted research revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-governed-job:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
      TR_RESEARCH_SHA: ${{ inputs.git_sha }}
      TR_GIT_REF: ${{ inputs.target_ref }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.job_id }}" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "${{ inputs.git_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "${{ inputs.target_ref }}"

      - name: Checkout certified infrastructure revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governed research revision exists exactly
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse '${{ inputs.git_sha }}^{commit}')"
          test "$resolved" = "${{ inputs.git_sha }}"
          echo "INFRASTRUCTURE_SHA=$(git rev-parse HEAD)"
          echo "RESEARCH_SHA=$resolved"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Certify cloud control-plane contracts
        run: pytest -q tests/test_ccp5_control_plane.py tests/test_ccp5_control_plane_worker.py tests/test_ccp8_autonomous_loop.py tests/test_ccp9_exact_claim.py tests/test_ccp10_input_materializer.py tests/test_ccp11_artifact_contract.py tests/test_research_revision_adapter.py tests/test_swing10_input_prepare.py tests/test_swing10_s2_b2_core.py tests/test_swing10_s2_b2.py

      - name: Establish immutable SW10 input through online infrastructure
        if: ${{ inputs.job_id == 'b355eadf-8cd3-417b-9508-b0d952e858ab' }}
        run: python -m cloud_compute.swing10_input_prepare --job-id "${{ inputs.job_id }}"

      - name: Execute exact governed research job
        run: python -m cloud_compute.autonomous_loop --executor github_actions --external-execution-id "$GITHUB_RUN_ID" --job-id "${{ inputs.job_id }}" --max-jobs 10

      - name: Independently read back SW10 output bytes into durable cache
        if: ${{ inputs.job_id == 'b355eadf-8cd3-417b-9508-b0d952e858ab' }}
        env:
          TR_GIT_SHA: ${{ github.sha }}
        run: python -m cloud_compute.artifact_readback --job-id "${{ inputs.job_id }}" --name factor_tail_summary.csv

      - name: Independently verify and durably read back B2 artifacts
        if: ${{ success() }}
        env:
          TR_GIT_SHA: ${{ github.sha }}
        run: |
          python -m cloud_compute.b2_readback_if_applicable --job-id "${{ inputs.job_id }}"
