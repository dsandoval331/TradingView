name: Autonomous Dispatch Certification V2

on:
  push:
    branches:
      - cloud-compute/autonomous-dispatch
    paths:
      - '.github/dispatch-cert-requests/*.json'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout certification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create harmless governed fixture job
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_PATH="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- '.github/dispatch-cert-requests/*.json' | tail -n 1)"
          test -n "$REQUEST_PATH"
          TARGET_SHA="$(jq -r '.git_sha' "$REQUEST_PATH")"
          TARGET_REF="$(jq -r '.target_ref' "$REQUEST_PATH")"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$TARGET_REF"
          export TARGET_SHA TARGET_REF
          python - <<'PY'
          import os
          from cloud_compute.control_plane import ControlPlaneConfig, create_job

          cfg = ControlPlaneConfig(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SECRET_KEY'])
          job = create_job(cfg, {
              'strategy_id': '98f761bf-c6f1-4399-b10e-e299cb332141',
              'runner_job_id': 'CCP3-PARITY-FIXTURE',
              'project_code': 'CLOUD_COMPUTE',
              'phase_code': 'OPERATING',
              'status': 'queued',
              'preferred_executor': 'github_actions',
              'cloud_run_spend_approved': False,
              'priority': 5,
              'git_sha': os.environ['TARGET_SHA'],
              'dataset_version': 'CCP-AUTONOMOUS-DISPATCH-FIXTURE-1',
              'parameters_json': {
                  'submission_source': 'cloud_compute_autonomous_dispatch_cert',
                  'purpose': 'Harmless governed autonomous-dispatch fixture',
                  'research_only': True,
                  'cost_policy': 'ZERO_INCREMENTAL_COST_FIRST',
                  'retry_policy': {'enabled': False},
              },
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"job_id={job['job_id']}\n")
          PY
          echo "git_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout exact governed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.fixture.outputs.git_sha }}
          fetch-depth: 1

      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ steps.fixture.outputs.git_sha }}"

      - name: Execute harmless governed fixture
        env:
          TR_GIT_SHA: ${{ steps.fixture.outputs.git_sha }}
          TR_GIT_REF: ${{ steps.fixture.outputs.target_ref }}
        run: >-
          python -m cloud_compute.autonomous_loop
          --executor github_actions
          --external-execution-id "$GITHUB_RUN_ID"
          --job-id "${{ steps.fixture.outputs.job_id }}"
          --max-jobs 1
