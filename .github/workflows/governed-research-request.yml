name: Governed Research Request

on:
  push:
    branches:
      - cloud-compute/autonomous-dispatch
    paths:
      - '.github/research-requests/*.json'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.TR_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.TR_SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Resolve governed request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_PATH="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- '.github/research-requests/*.json' | tail -n 1)"
          test -n "$REQUEST_PATH"
          JOB_ID="$(jq -r '.job_id' "$REQUEST_PATH")"
          TARGET_SHA="$(jq -r '.git_sha' "$REQUEST_PATH")"
          TARGET_REF="$(jq -r '.target_ref' "$REQUEST_PATH")"
          [[ "$JOB_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$TARGET_REF"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "git_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
      - name: Checkout exact governed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.git_sha }}
          fetch-depth: 1
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ steps.request.outputs.git_sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute governed job
        env:
          TR_GIT_SHA: ${{ steps.request.outputs.git_sha }}
          TR_GIT_REF: ${{ steps.request.outputs.target_ref }}
        run: >-
          python -m cloud_compute.autonomous_loop
          --executor github_actions
          --external-execution-id "$GITHUB_RUN_ID"
          --job-id "${{ steps.request.outputs.job_id }}"
          --max-jobs 1
